plugins {
    id 'com.android.application'
}

android {
    namespace 'com.miragebridge'
    compileSdk 28

    defaultConfig {
        applicationId "com.miragebridge"
        minSdk 26
        targetSdk 26

        versionCode 1
        versionName "0.1.0"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -fexceptions -frtti"
                arguments "-DANDROID_STL=c++_shared",
                        "-DGVR_SDK_EXTRACT_DIR=${buildDir}/gvr-base"
            }
        }

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        debug {
            debuggable true
        }

        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile(
                    'proguard-android-optimize.txt'
            ), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

def gvrBaseAar = rootProject.file("../../gvr-android-sdk/libraries/sdk-base-1.190.0.aar")

def gvrExtractDir = layout.buildDirectory.dir("gvr-base")

tasks.register("extractGvrBaseAar", Copy) {
    from zipTree(gvrBaseAar)
    into gvrExtractDir
}

tasks.named("preBuild").configure {
    dependsOn("extractGvrBaseAar")
}

dependencies {
    implementation(name: "sdk-base-1.190.0", ext: "aar")
}
